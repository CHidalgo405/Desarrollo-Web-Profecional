<nav class="breadcrumb-container" aria-label="breadcrumb">
  <ol class="breadcrumb-list">
    
    <li class="breadcrumb-item home-icon">
      <a routerLink="/"><i class='bx bx-home-smile'></i></a>
      <i class='bx bx-chevron-right separator-icon'></i>
    </li>

    <ng-container *ngFor="let crumb of crumbs; let last = last">
      
      <li *ngIf="!last" class="breadcrumb-item">
        <a [routerLink]="crumb.url" class="crumb-link">
          {{ crumb.label }}
        </a>
        <i class='bx bx-chevron-right separator-icon'></i>
      </li>

      <li *ngIf="last" class="breadcrumb-item active" aria-current="page">
        <span class="crumb-text">{{ crumb.label }}</span>
      </li>

    </ng-container>
  </ol>
</nav>
